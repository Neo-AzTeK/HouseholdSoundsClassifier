[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "household-sounds"
version = "0.2.0"
description = "Real-time household sound classifier with dual CPU/NPU inference and browser streaming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
]

[project.scripts]
sound-web = "household_sounds.web.app:main"
sound-predict = "household_sounds.predict:main"
sound-train = "household_sounds.train:main"
sound-dataset = "household_sounds.dataset:main"
sound-export = "household_sounds.hailo.export_onnx:main"
sound-compile = "household_sounds.hailo.compile:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["household_sounds"]

[tool.uv]
managed = true
